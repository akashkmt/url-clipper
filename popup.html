<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Clipper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="brand">
          <svg
            class="brand-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
          >
            <path
              d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
            />
            <path
              d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
            />
          </svg>
          <span class="brand-name">URL Clipper</span>
        </div>
        <button
          class="shortcut-btn"
          id="shortcutBtn"
          title="Edit shortcut"
          aria-label="Current shortcut — click to edit"
        >
          <div class="shortcut-keys" id="shortcutDisplay">
            <span class="shortcut-fallback">Edit</span>
          </div>
        </button>
      </div>

      <div class="url-card">
        <div class="url-meta">Current tab</div>
        <div class="url-text" id="pageUrl">Loading…</div>
      </div>

      <button class="copy-btn" id="copyUrlBtn">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
        >
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path
            d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
          ></path>
        </svg>
        <span id="btnText">Copy URL</span>
      </button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
